<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>KOSZAKA RPG</title><script src="https://telegram.org/js/telegram-web-app.js"></script><style>
:root{--pink:#ff72d2}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#57315f,#170e20 70%);color:#fff;font-family:system-ui,sans-serif}.app{max-width:520px;margin:auto;padding:16px}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-size:22px;font-weight:900;letter-spacing:2px;color:var(--pink)}.panel{background:linear-gradient(145deg,#432650,#2a1935);border:1px solid #754b80;border-radius:22px;padding:15px;margin:12px 0}.room{height:270px;border-radius:18px;background:linear-gradient(#9b5caa33,#f77ad333),linear-gradient(180deg,#52365f 0 65%,#8e5b79 65%);display:flex;flex-direction:column;align-items:center;justify-content:center}.cat{font-size:112px;cursor:pointer}.name{font-weight:800}.muted{font-size:12px;color:#d9b9e4}.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stat{background:#24152d;border-radius:12px;padding:9px;font-size:12px}.bar{height:8px;background:#57405f;border-radius:20px;margin-top:6px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,#ff75c9,#ffc0ed)}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.act{background:#593568;border:0;border-radius:14px;color:white;padding:12px 4px;font-weight:700}.act b{display:block;font-size:24px}.log{font-size:13px;color:#f4d8f0;min-height:20px}
</style></head><body><main class="app"><div class="top"><div class="brand">♛ KOSZAKA ♛</div><div>🐾 <b id="coins">120</b></div></div><section class="panel"><div style="display:flex;justify-content:space-between"><b>МОЙ ДОМИК</b><span>Уровень <b id="level">1</b></span></div><div class="room"><div class="cat" id="cat">🐈‍⬛</div><div class="name" id="petname">Косик</div><div class="muted" id="mood">Нажми на котика, чтобы погладить</div></div><p class="muted">Опыт: <b id="xp">0</b>/100</p><div class="stats" id="stats"></div></section><section class="panel"><b>УХОД ЗА КОТИКОМ</b><div class="actions" style="margin-top:12px"><button class="act" data-a="feed"><b>🍗</b>Кормить</button><button class="act" data-a="play"><b>🧶</b>Играть</button><button class="act" data-a="bath"><b>🛁</b>Купать</button><button class="act" data-a="sleep"><b>🛏️</b>Спать</button><button class="act" data-a="pet"><b>💕</b>Гладить</button><button class="act" data-a="quest"><b>🎯</b>Задание</button></div><p class="log" id="log">Подключаем профиль Telegram…</p></section><p class="muted" style="text-align:center">KOSZAKA RPG · тестовая версия</p></main><script>
const tg=window.Telegram?.WebApp;tg?.ready();tg?.expand();const initData=tg?.initData||'';let state={hunger:80,energy:80,cleanliness:80,happiness:80,coins:120,xp:0,level:1};const labels={hunger:'🍗 Голод',energy:'⚡ Энергия',cleanliness:'🛁 Чистота',happiness:'💗 Настроение'};const $=id=>document.getElementById(id);
function render(){ $('coins').textContent=state.coins;$('level').textContent=state.level;$('xp').textContent=state.xp;$('stats').innerHTML=Object.entries(labels).map(([k,l])=>`<div class="stat">${l} <b style="float:right">${state[k]}</b><div class="bar"><div class="fill" style="width:${state[k]}%"></div></div></div>`).join('');}
async function api(path,body){const r=await fetch(path,{method:body?'POST':'GET',headers:{'Content-Type':'application/json','X-Telegram-Init-Data':initData},body:body?JSON.stringify(body):undefined});const d=await r.json();if(!r.ok)throw Error(d.error||'Ошибка');return d}
async function load(){if(!initData){$('log').textContent='Открой игру через Telegram, чтобы загрузить свой профиль.';render();return}try{state=await api('/api/me');$('petname').textContent=state.pet_name||'Косик';$('log').textContent='Профиль загружен!';render()}catch(e){$('log').textContent=e.message}}
async function action(a){try{const d=await api('/api/action',{action:a});state=d;render();$('log').textContent=({feed:'Косик вкусно поел!',play:'Косик поиграл с клубочком!',bath:'Косик теперь чистенький!',sleep:'Косик выспался!',pet:'Муррр! Косик доволен!',quest:'Задание выполнено! +25 🐾'})[a]}catch(e){$('log').textContent=e.message}}
document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>action(b.dataset.a));$('cat').onclick=()=>action('pet');render();load();
</script></body></html>
