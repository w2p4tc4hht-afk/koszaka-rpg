let lastTap=0;renderer.domElement.addEventListener('pointerdown',e=>{const rect=renderer.domElement.getBoundingClientRect();const x=((e.clientX-rect.left)/rect.width)*2-1,y=-((e.clientY-rect.top)/rect.height)*2+1;const ray=new THREE.Raycaster();ray.setFromCamera(new THREE.Vector2(x,y),camera);const hits=ray.intersectObject(cat,true);if(hits.length){const now=Date.now();if(now-lastTap<360){actionState='swat';actionUntil=clock.getElapsedTime()+1.2;say('Эй! Не балуйся! 🐾')}else{doAction('pet')}lastTap=now}});
document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>{const a=b.dataset.action;if(a==='foodshop'){openShop('food');return}if(a==='clotheshop'){openShop('clothes');return}if(a==='feed'){const available=shopData.items.find(x=>x.category==='food'&&(shopData.foodStock?.[x.id]||0)>0);if(available){feedWith(available.id)}else{openShop('food')}return}doAction(a)});
function renderShop(){const list=shopData.items.filter(x=>x.category===currentShop);$('shopTitle').textContent=currentShop==='food'?'🥣 Магазин еды':currentShop==='clothes'?'👗 Магазин одежды':'🏡 Магазин домика';document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===currentShop));$('items').innerHTML=list.map(it=>{const owned=shopData.inventory.includes(it.id),count=shopData.foodStock?.[it.id]||0,active=shopData.equipped?.[it.slot]===it.id;const button=currentShop==='food'?(count>0?'Покормить':'Купить'):(active?'Надето':owned?'Надеть':'Купить');return '<div class="item"><div class="itemicon">'+it.emoji+'</div><strong>'+it.name+'</strong><small>'+it.price+' 🟡'+(currentShop==='food'?' · Есть: '+count:'')+'</small><button data-item="'+it.id+'">'+button+'</button></div>'}).join('')||'<p>Пока пусто</p>';$('items').querySelectorAll('[data-item]').forEach(b=>b.onclick=async()=>{const it=list.find(x=>x.id===b.dataset.item);try{if(it.category==='food'){if((shopData.foodStock?.[it.id]||0)>0){await feedWith(it.id);return}const q=await api('/api/buy',{itemId:it.id});state.coins=q.coins;shopData.foodStock=q.foodStock||{};say('Запас еды пополнен!')}else if(shopData.inventory.includes(it.id)){const q=await api('/api/equip',{itemId:it.id});shopData.equipped=q.equipped||{};shopData.inventory=q.inventory||shopData.inventory;applyAccessories(shopData.equipped);say('Котику очень идёт! 💖')}else{const q=await api('/api/buy',{itemId:it.id});shopData.inventory=q.inventory||shopData.inventory;state.coins=q.coins;say('Новая вещица! 🎁')}render();renderShop()}catch(e){say(e.message)}})}
async function openShop(category){currentShop=category;$('shop').classList.add('open');try{shopData=await api('/api/shop');renderShop()}catch(e){$('items').textContent=e.message}}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{currentShop=b.dataset.tab;renderShop()});$('close').onclick=()=>$('shop').classList.remove('open');
render();load();
</script></body></html>
