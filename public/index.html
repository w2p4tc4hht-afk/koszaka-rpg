<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#b9d9e7"><title>KOSZAKA 3D</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#17202b;color:#fff;font-family:system-ui,-apple-system,sans-serif}.game{position:relative;width:100%;height:100dvh;max-width:560px;margin:auto;overflow:hidden;background:#b8dce9}.scene{position:absolute;inset:0 0 0 0}.scene canvas{display:block;width:100%;height:100%}.top{position:absolute;z-index:4;top:calc(env(safe-area-inset-top) + 9px);left:12px;right:12px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none}.level{border:3px solid #eee;background:#5b49b8;border-radius:50%;width:46px;height:46px;display:grid;place-items:center;font-size:21px;font-weight:1000;text-shadow:0 2px #34276b;box-shadow:0 2px 5px #3338}.resources{display:flex;gap:7px}.resource{background:#fff;border:2px solid #8a9da7;border-radius:18px;padding:4px 9px;color:#333;font-weight:1000;font-size:13px;box-shadow:0 2px 4px #3335}.brand{position:absolute;top:calc(env(safe-area-inset-top) + 62px);left:12px;color:#fff;font-size:13px;font-weight:1000;text-shadow:0 2px 4px #456;letter-spacing:1px;z-index:3}.bubble{position:absolute;top:34%;left:50%;transform:translate(-50%,-50%);z-index:5;background:#fff;color:#60476b;border-radius:18px;padding:9px 13px;font-size:13px;font-weight:900;box-shadow:0 3px 12px #3335;opacity:0;transition:.2s;pointer-events:none}.bubble.show{opacity:1}.bottom{position:absolute;z-index:4;bottom:calc(env(safe-area-inset-bottom) + 12px);left:10px;right:10px;display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.action{border:2px solid #a5a5a5;border-radius:50%;aspect-ratio:1;background:linear-gradient(#fff,#e1e1e1);box-shadow:0 3px 4px #3336;display:grid;place-items:center;color:#333;font-size:25px;padding:0}.action:active{transform:scale(.92)}.action.shop{font-size:23px}.meterrow{position:absolute;z-index:4;bottom:calc(env(safe-area-inset-bottom) + 80px);left:15px;right:15px;display:flex;justify-content:space-between;gap:7px}.meter{flex:1;text-align:center;color:#fff;text-shadow:0 1px 3px #333;font-size:10px;font-weight:900}.meter b{display:block;background:#fff;border:1px solid #777;border-radius:9px;color:#333;text-shadow:none;padding:2px}.meter i{display:block;height:5px;background:#d7d7d7;border-radius:6px;overflow:hidden;margin-top:3px}.meter em{display:block;height:100%;background:#75d82e}.notice{position:absolute;z-index:6;left:10px;right:10px;bottom:calc(env(safe-area-inset-bottom) + 145px);text-align:center;font-size:12px;font-weight:800;color:#fff;text-shadow:0 2px 4px #333;pointer-events:none}.modal{display:none;position:absolute;z-index:10;inset:12% 5% 15%;background:#f7efff;border:3px solid #8c63a5;border-radius:22px;color:#392844;padding:16px;overflow:auto;box-shadow:0 8px 35px #0008}.modal.open{display:block}.modal h2{margin:0 0 12px}.close{float:right;border:0;border-radius:50%;width:32px;height:32px;font-size:20px}.items{display:grid;grid-template-columns:1fr 1fr;gap:8px}.item{background:#fff;border:1px solid #d3b7dd;border-radius:14px;padding:10px;text-align:center}.item strong{display:block;font-size:12px}.item button{margin-top:7px;background:#b747cf;color:#fff;border:0;border-radius:9px;padding:7px 12px;font-weight:900}.footer{position:absolute;top:calc(env(safe-area-inset-top) + 9px);left:50%;transform:translateX(-50%);z-index:3;font-size:10px;letter-spacing:2px;font-weight:1000;color:#fff;text-shadow:0 2px 4px #333;white-space:nowrap}
</style></head><body><main class="game"><div class="scene" id="scene"></div><div class="footer">KOSZAKA · МОЙ ПУШИСТЫЙ ДОМ</div>
<div class="top"><div class="level" id="level">1</div><div class="resources"><div class="resource">💎 0</div><div class="resource">🟡 <span id="coins">120</span></div></div></div>
<div class="brand">МОЙ ДОМИК</div><div class="bubble" id="bubble">Мурр! 💗</div>
<div class="meterrow" id="meters"></div><div class="bottom">
<button class="action shop" data-action="shop" aria-label="Магазин">🛒</button>
<button class="action" data-action="pet" aria-label="Погладить">☻</button>
<button class="action" data-action="feed" aria-label="Покормить">🍗</button>
<button class="action" data-action="bath" aria-label="Купать">🛁</button>
<button class="action" data-action="sleep" aria-label="Спать">🌙</button>
</div><div class="notice" id="notice">Нажми на Косика, чтобы поиграть с ним</div>
<section class="modal" id="shop"><button class="close" id="close">×</button><h2>🛍️ Магазин домика</h2><div class="items" id="items"></div></section></main>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js';
const tg=window.Telegram?.WebApp;tg?.ready();tg?.expand();const initData=tg?.initData||'';
const root=document.getElementById('scene');const scene=new THREE.Scene();scene.background=new THREE.Color(0xb8dce9);scene.fog=new THREE.Fog(0xb8dce9,13,25);
const camera=new THREE.PerspectiveCamera(34,innerWidth/innerHeight,.1,100);camera.position.set(0,3.2,10.5);camera.lookAt(0,1.65,0);
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.2;root.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0x8a6a87,2.0));const sun=new THREE.DirectionalLight(0xfff1dc,3.0);sun.position.set(-4,8,6);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);scene.add(sun);
const mat=(color,roughness=.82)=>new THREE.MeshStandardMaterial({color,roughness});
function box(w,h,d,m,x,y,z,rx=0,ry=0,rz=0){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);o.rotation.set(rx,ry,rz);o.castShadow=true;o.receiveShadow=true;scene.add(o);return o}
function sphere(x,y,z,sx,sy,sz,m,parent=scene){const o=new THREE.Mesh(new THREE.SphereGeometry(1,32,24),m);o.position.set(x,y,z);o.scale.set(sx,sy,sz);o.castShadow=true;o.receiveShadow=true;parent.add(o);return o}
function cyl(rt,rb,h,m,x,y,z,parent=scene){const o=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,24),m);o.position.set(x,y,z);o.castShadow=true;parent.add(o);return o}
const wall=mat(0x9ed4e5),floor=mat(0x9a654d),white=mat(0xfff4e9),cream=mat(0xf2e4d3),black=mat(0x242633),pink=mat(0xe9a5b7),wood=mat(0x9d5838),green=mat(0x58b96a),gold=mat(0xc38b43),blue=mat(0x67b9da);
box(12,7,.25,wall,0,3.5,-2.6);box(12,.25,10,floor,0,-.14,1);box(.25,7,10,wall,-6,3.5,1);box(.25,7,10,wall,6,3.5,1);
// window with sky panes
box(2.1,2.35,.12,cream,-3.5,4.1,-2.42);box(1.82,2.05,.06,blue,-3.5,4.1,-2.32);box(.09,2.1,.08,white,-3.5,4.1,-2.2);box(1.9,.09,.08,white,-3.5,4.1,-2.2);
box(2.7,.18,1.25,mat(0xe5a26f),3.5,1.2,-1.45);box(2.7,.75,1.15,mat(0x43aa65),3.5,1.65,-1.65);box(.2,1.25,.2,wood,2.35,.6,-1.3);box(.2,1.25,.2,wood,4.65,.6,-1.3);
box(1.4,1.35,.8,mat(0x54b8cb),-4.45,.68,-1.1);box(1.5,.18,.9,cream,-4.45,1.4,-1.1);
const rug=sphere(0,.015,.6,2.7,.06,1.35,mat(0xd77ca8));rug.scale.set(2.7,.06,1.35);
box(.9,.75,.7,wood,-4.5,.4,1.5);cyl(.34,.34,.06,gold,-4.5,.82,1.5);
const lamp=cyl(.1,.1,.9,wood,4.8,.45,1.2);sphere(4.8,1.05,1.2,.38,.34,.38,mat(0xffd58d));
// cat group
const cat=new THREE.Group();scene.add(cat);cat.position.set(0,0,.2);
const fur=mat(0xf5eee8),furShade=mat(0xd9c9bf),nose=mat(0xe58d9c),eye=mat(0x33252c),iris=mat(0x6c9c65),shirt=mat(0x252735),bow=mat(0xd94872);
sphere(0,1.08,0,.58,.72,.42,fur,cat);sphere(0,1.05,.27,.42,.53,.18,shirt,cat); // body and tuxedo
sphere(0,2.02,0,.67,.63,.58,fur,cat);
for(const x of [-.47,.47]){const ear=new THREE.Mesh(new THREE.ConeGeometry(.23,.55,4),fur);ear.position.set(x,2.53,0);ear.rotation.z=x<0?.22:-.22;ear.castShadow=true;cat.add(ear);const inner=new THREE.Mesh(new THREE.ConeGeometry(.12,.34,4),pink);inner.position.set(x,2.56,.09);inner.rotation.z=x<0?.22:-.22;cat.add(inner);}
for(const x of [-.25,.25]){sphere(x,2.1,.51,.105,.14,.07,white,cat);sphere(x,2.1,.575,.052,.095,.035,iris,cat);sphere(x,2.1,.605,.023,.07,.018,eye,cat);sphere(x-.02,2.15,.62,.018,.025,.012,white,cat);}
sphere(0,1.91,.61,.16,.12,.12,cream,cat);sphere(0,1.96,.72,.075,.05,.045,nose,cat);
const smile=new THREE.Mesh(new THREE.TorusGeometry(.12,.018,8,20,Math.PI),eye);smile.position.set(0,1.83,.68);smile.rotation.z=Math.PI;cat.add(smile);
for(const x of [-.36,.36]){sphere(x,.5,.04,.16,.53,.17,fur,cat);sphere(x,.12,.14,.23,.13,.3,furShade,cat);}
for(const x of [-.61,.61]){const arm=sphere(x,1.2,.05,.16,.45,.16,fur,cat);arm.rotation.z=x<0?-.45:.45;}
const tailCurve=new THREE.CatmullRomCurve3([new THREE.Vector3(.42,.72,-.18),new THREE.Vector3(.85,.8,-.25),new THREE.Vector3(1.1,1.2,-.28),new THREE.Vector3(.92,1.48,-.25),new THREE.Vector3(.62,1.42,-.22)]);const tail=new THREE.Mesh(new THREE.TubeGeometry(tailCurve,32,.105,12,false),furShade);tail.castShadow=true;cat.add(tail);
sphere(0,1.58,.5,.22,.16,.1,white,cat); // shirt collar
// bowtie
sphere(-.12,1.53,.59,.12,.08,.05,bow,cat);sphere(.12,1.53,.59,.12,.08,.05,bow,cat);sphere(0,1.53,.64,.055,.055,.04,gold,cat);
// floor shadow / interaction
const hit=new THREE.Mesh(new THREE.CircleGeometry(1.1,32),new THREE.MeshBasicMaterial({color:0x5b4751,transparent:true,opacity:.13}));hit.rotation.x=-Math.PI/2;hit.position.set(0,.01,.2);scene.add(hit);
let actionState='idle',actionUntil=0,blinkAt=0;const clock=new THREE.Clock();
function resize(){const w=root.clientWidth,h=root.clientHeight;camera.aspect=w/h;camera.updateProjectionMatrix();renderer.setSize(w,h,false)}addEventListener('resize',resize);resize();
function animate(){requestAnimationFrame(animate);const t=clock.getElapsedTime();cat.position.y=actionState==='sleep'?-.04+Math.sin(t*2)*.025:Math.sin(t*2.1)*.035;cat.rotation.y=Math.sin(t*.55)*.08;tail.rotation.x=Math.sin(t*2.5)*.16;
if(actionState==='play'&&t>actionUntil)actionState='idle';if(actionState==='play'){cat.position.y+=Math.abs(Math.sin(t*9))*.22;cat.rotation.z=Math.sin(t*9)*.08}else if(actionState==='sleep'){cat.rotation.x=.08;cat.scale.y=.96}else{cat.rotation.x=0;cat.scale.y=1}
renderer.render(scene,camera)}animate();
let state={hunger:80,energy:80,cleanliness:80,happiness:80,coins:120,xp:0,level:1};const labels={hunger:'СЫТОСТЬ',energy:'ЭНЕРГИЯ',cleanliness:'ЧИСТОТА',happiness:'РАДОСТЬ'};const $=id=>document.getElementById(id);
function render(){ $('coins').textContent=state.coins??0;$('level').textContent=state.level??1;$('meters').innerHTML=Object.entries(labels).map(([k,v])=>'<div class="meter">'+v+'<b>'+(state[k]??0)+'%</b><i><em style="width:'+Math.max(0,Math.min(100,state[k]??0))+'%"></em></i></div>').join('');}
async function api(path,body){const r=await fetch(path,{method:body?'POST':'GET',headers:{'Content-Type':'application/json','X-Telegram-Init-Data':initData},body:body?JSON.stringify(body):undefined});const d=await r.json();if(!r.ok)throw Error(d.error||'Ошибка');return d}
async function load(){if(!initData){$('notice').textContent='Открой игру через Telegram для сохранения прогресса';return}try{state=await api('/api/me');render()}catch(e){$('notice').textContent=e.message}}
let bubbleTimer;function say(s){$('bubble').textContent=s;$('bubble').classList.add('show');clearTimeout(bubbleTimer);bubbleTimer=setTimeout(()=>$('bubble').classList.remove('show'),1700)}
const messages={feed:'Ням-ням! Очень вкусно! 🐟',play:'Ура! Давай играть! 🧶',bath:'Теперь я чистый! 🫧',sleep:'Мрр… сладких снов… 🌙',pet:'Муррр! Люблю тебя! 💗',quest:'Задание выполнено! ⭐'};
async function doAction(a){actionState=a==='play'?'play':a==='sleep'?'sleep':'idle';actionUntil=clock.getElapsedTime()+2.5;if(a==='pet'){cat.rotation.z=.12;setTimeout(()=>cat.rotation.z=0,450)}say(messages[a]||'Мяу!');try{state=await api('/api/action',{action:a});render()}catch(e){$('notice').textContent=e.message}}
renderer.domElement.addEventListener('pointerdown',e=>{const rect=renderer.domElement.getBoundingClientRect();const x=((e.clientX-rect.left)/rect.width)*2-1,y=-((e.clientY-rect.top)/rect.height)*2+1;const ray=new THREE.Raycaster();ray.setFromCamera(new THREE.Vector2(x,y),camera);const hits=ray.intersectObject(cat,true);if(hits.length)doAction('pet')});
document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>{const a=b.dataset.action;if(a==='shop'){openShop();return}doAction(a)});
async function openShop(){ $('shop').classList.add('open');try{const d=await api('/api/shop');$('items').innerHTML=d.items.map(it=>{const owned=d.inventory.includes(it.id);return '<div class="item"><div style="font-size:28px">'+it.emoji+'</div><strong>'+it.name+'</strong><small>'+it.price+' 🟡</small><button data-item="'+it.id+'">'+(owned?'Надеть':'Купить')+'</button></div>'}).join('');$('items').querySelectorAll('button').forEach(b=>b.onclick=async()=>{const id=b.dataset.item;try{const owned=d.inventory.includes(id);const q=await api(owned?'/api/equip':'/api/buy',{itemId:id});d.inventory=q.inventory||d.inventory;state.coins=q.coins??state.coins;render();say(owned?'Надето!':'Куплено!');openShop()}catch(e){say(e.message)}})}catch(e){$('items').textContent=e.message}}
$('close').onclick=()=>$('shop').classList.remove('open');
render();load();
</script></body></html>
