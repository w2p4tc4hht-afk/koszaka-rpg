<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#24122f"><title>KOSZAKA RPG</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#1b1025;--panel:#2c1938;--line:#654273;--pink:#ff67c8;--lilac:#c68cff;--cream:#ffe9f7;--muted:#c9afcf}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -15%,#75417e 0,#311d3d 42%,var(--bg) 78%);color:#fff;font-family:ui-rounded,system-ui,-apple-system,sans-serif;min-height:100vh}
.app{width:min(100%,560px);margin:auto;padding:14px 14px calc(24px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;justify-content:space-between;padding:5px 3px 13px}.brand{font-size:22px;font-weight:1000;letter-spacing:2px;color:#ff82d7;text-shadow:0 0 18px #ff58c477}.wallet{border:1px solid #9861a0;background:#3a2347;border-radius:30px;padding:8px 13px;font-weight:900}
.levelrow{display:flex;justify-content:space-between;align-items:center;margin:4px 4px 10px;font-weight:800}.levelpill{background:#4c2b59;border:1px solid #885994;border-radius:20px;padding:6px 11px;font-size:12px;color:#ffd9f4}
.room{position:relative;height:360px;border:1px solid #9c6ca6;border-radius:25px;overflow:hidden;background:linear-gradient(180deg,#9866a5 0%,#734c83 62%,#d28ab0 62%,#b96e9b 100%);box-shadow:0 18px 40px #09051066,inset 0 0 35px #ffd4ff20}
.room:before{content:"";position:absolute;left:7%;top:8%;width:28%;height:43%;border:7px solid #e9b7dc;border-radius:80px 80px 8px 8px;background:linear-gradient(90deg,#ffc6e766 48%,#fff0 49%),linear-gradient(#b7c5ef,#ffe0f1);box-shadow:0 0 0 5px #71467b}
.room:after{content:"";position:absolute;right:-25px;bottom:0;width:44%;height:54%;background:linear-gradient(135deg,#d79aba,#8f557e);clip-path:polygon(18% 0,100% 0,100% 100%,0 100%);opacity:.8}
.shelf{position:absolute;right:8%;top:16%;width:27%;height:9px;border-radius:8px;background:#eab5d8;box-shadow:0 8px 0 #784b79}.plant{position:absolute;right:14%;top:4%;font-size:37px;z-index:1}.rug{position:absolute;bottom:7%;left:19%;width:58%;height:45px;border-radius:50%;background:#f3b4dc66;border:2px solid #f8d0ed77;z-index:1}
.roomtop{position:absolute;z-index:4;left:15px;right:15px;top:13px;display:flex;justify-content:space-between;font-size:11px;font-weight:800;color:#ffe9f7;text-shadow:0 2px 5px #4b245e}
.catwrap{position:absolute;z-index:3;left:50%;top:48%;transform:translate(-50%,-50%);width:245px;height:225px;display:grid;place-items:center;cursor:pointer;filter:drop-shadow(0 12px 7px #3a1a4055);transition:transform .2s}
.catwrap:active{transform:translate(-50%,-48%) scale(.97)}.cat-svg{width:100%;height:100%;overflow:visible}.tail{transform-origin:174px 145px;animation:tail 2.4s ease-in-out infinite}.blink{animation:blink 4.8s infinite;transform-origin:center}.catwrap.playing .cat-svg{animation:bounce .48s ease-in-out 3}.catwrap.sleeping .cat-svg{animation:snooze 2s ease-in-out infinite}
@keyframes tail{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(13deg)}}@keyframes blink{0%,45%,49%,100%{transform:scaleY(1)}47%{transform:scaleY(.08)}}@keyframes bounce{50%{transform:translateY(-15px) rotate(-3deg)}}@keyframes snooze{50%{transform:translateY(5px) scale(.98)}}
.petname{position:absolute;z-index:5;bottom:17px;left:0;right:0;text-align:center;font-size:20px;font-weight:1000;text-shadow:0 2px 8px #66305d}.speech{position:absolute;z-index:6;top:24%;left:57%;background:#fff4fb;color:#673b70;border-radius:18px 18px 18px 4px;padding:8px 12px;font-size:12px;font-weight:800;box-shadow:0 5px 14px #40204644;opacity:0;transform:translateY(8px);transition:.2s}.speech.show{opacity:1;transform:translateY(0)}
.xpbox{padding:12px 4px 15px}.xptext{display:flex;justify-content:space-between;color:#e7cce9;font-size:12px;margin-bottom:7px}.xpbar,.meter{height:8px;border-radius:20px;background:#50365a;overflow:hidden}.xpfill,.meterfill{height:100%;border-radius:20px;background:linear-gradient(90deg,#ff69c9,#d39aff);transition:width .35s}
.panel{background:linear-gradient(145deg,#382146,#291832);border:1px solid #704b7d;border-radius:22px;padding:15px;margin-top:12px;box-shadow:0 10px 24px #10081844}.sectiontitle{font-size:14px;font-weight:1000;letter-spacing:.8px;margin:0 0 12px;color:#ffe6f7}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:#21132b;border:1px solid #4b3156;border-radius:14px;padding:10px}.stathead{display:flex;justify-content:space-between;gap:6px;font-size:11px;color:#e8d1eb;margin-bottom:7px}.stathead b{color:#fff;font-size:12px}
.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.act{min-height:83px;border:1px solid #765083;background:linear-gradient(145deg,#60376f,#492956);border-radius:17px;color:white;font:800 12px inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;box-shadow:inset 0 1px #ffffff15;transition:transform .15s,filter .15s}.act:active{transform:scale(.96);filter:brightness(1.2)}.act .emoji{font-size:27px;line-height:1.1}.act:disabled{opacity:.55}
.daily{width:100%;margin-top:12px;border:0;border-radius:16px;padding:15px;background:linear-gradient(100deg,#ff61c5,#a64cff);color:white;font-size:14px;font-weight:1000;box-shadow:0 8px 22px #ce4bc655}.daily:disabled{filter:grayscale(.5);opacity:.65}
.log{min-height:20px;margin:10px 2px 0;color:#f5d9ef;font-size:12px;text-align:center}.shopgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.shopitem{background:#21132b;border:1px solid #60416b;border-radius:15px;padding:10px;text-align:center}.shopitem .itememoji{font-size:27px}.shopitem b{display:block;font-size:12px;margin:4px 0}.shopitem small{color:#d6b6dc}.shopitem button{width:100%;margin-top:8px;border:0;border-radius:10px;padding:9px 5px;background:linear-gradient(90deg,#ff69c9,#a94de2);color:white;font-weight:900;font-size:11px}.shopitem button:disabled{opacity:.5}.shophead{display:flex;justify-content:space-between;align-items:center}.equipped{position:absolute;z-index:5;top:35%;left:50%;transform:translateX(-50%);font-size:35px;filter:drop-shadow(0 3px 3px #321538)}.room.has-bed .rug{height:65px;background:#d69bc4aa}.room.has-plant .plant{font-size:49px}.footer{text-align:center;color:#a989b2;font-size:10px;letter-spacing:1.5px;padding:15px}
@media(max-width:380px){.room{height:330px}.catwrap{width:220px;height:205px}.act{min-height:76px}.app{padding-left:11px;padding-right:11px}}
</style></head>
<body><main class="app">
<header><div class="brand">♛ KOSZAKA ♛</div><div class="wallet">🐾 <span id="coins">120</span></div></header>
<div class="levelrow"><span>МОЙ ДОМИК</span><span class="levelpill">УРОВЕНЬ <b id="level">1</b></span></div>
<section class="room" aria-label="Комната Косика">
<div class="roomtop"><span>🏡 ДОМАШНИЙ УЮТ</span><span>☀️ ДОМА</span></div><div class="shelf"></div><div class="plant">🪴</div><div class="rug"></div>
<div class="speech" id="speech">Мяу! 💗</div><div class="equipped" id="catitem"></div>
<div class="catwrap" id="cat" role="button" aria-label="Погладить котика" tabindex="0">
<svg class="cat-svg" viewBox="0 0 240 220" xmlns="http://www.w3.org/2000/svg">
<defs><linearGradient id="fur" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#77717f"/><stop offset=".48" stop-color="#45414f"/><stop offset="1" stop-color="#252330"/></linearGradient><linearGradient id="belly" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#8b8490"/><stop offset="1" stop-color="#514b59"/></linearGradient></defs>
<path class="tail" d="M166 145 C205 151 221 126 210 99 C204 83 187 83 174 91" fill="none" stroke="#393542" stroke-width="17" stroke-linecap="round"/><path d="M166 145 C205 151 221 126 210 99" fill="none" stroke="#77717d" stroke-width="5" stroke-linecap="round" opacity=".45"/>
<ellipse cx="119" cy="151" rx="65" ry="39" fill="url(#fur)"/><ellipse cx="124" cy="158" rx="39" ry="26" fill="url(#belly)" opacity=".5"/>
<path d="M76 160 Q69 183 61 193 Q55 202 66 203 L83 201 Q91 196 91 181 L99 159Z" fill="#393542"/><path d="M145 161 Q151 183 146 195 Q143 204 156 204 L171 201 Q179 196 171 186 L169 158Z" fill="#34313e"/>
<path d="M63 190 Q59 201 48 202 Q41 205 49 210 L74 210 Q85 208 82 198" fill="#514b59"/><path d="M148 192 Q145 203 135 204 Q127 208 137 211 L164 211 Q176 209 169 199" fill="#514b59"/>
<path d="M54 100 L59 43 Q61 33 70 42 L96 68Z" fill="#34313f"/><path d="M111 66 L139 39 Q149 30 151 45 L150 103Z" fill="#34313f"/><path d="M65 53 L69 45 L87 68Z" fill="#bd789e"/><path d="M138 52 L146 44 L143 73Z" fill="#bd789e"/>
<path d="M53 100 Q54 64 91 62 Q131 58 147 92 Q157 122 133 144 Q108 164 76 143 Q48 127 53 100Z" fill="url(#fur)"/>
<path d="M69 98 Q79 83 92 96 Q94 108 81 111 Q68 109 69 98Z" fill="#d9d2df"/><path d="M111 95 Q124 82 137 96 Q138 108 125 111 Q111 109 111 95Z" fill="#d9d2df"/>
<g class="blink"><ellipse cx="82" cy="100" rx="5" ry="8" fill="#b7d69b"/><ellipse cx="125" cy="100" rx="5" ry="8" fill="#b7d69b"/><ellipse cx="83" cy="101" rx="2" ry="5" fill="#24202a"/><ellipse cx="126" cy="101" rx="2" ry="5" fill="#24202a"/></g>
<path d="M99 119 Q105 114 111 119 Q106 126 99 119Z" fill="#e9a4bf"/><path d="M105 124 Q101 132 94 129 M106 124 Q112 132 119 128" fill="none" stroke="#26222d" stroke-width="2" stroke-linecap="round"/>
<path d="M65 119 L34 114 M66 127 L36 131 M142 119 L172 113 M142 128 L172 132" stroke="#d5c8d9" stroke-width="1.7" stroke-linecap="round"/>
<path d="M73 75 Q85 69 96 77 M113 77 Q127 68 139 77" stroke="#282430" stroke-width="3" fill="none" stroke-linecap="round"/>
</svg></div><div class="petname" id="petname">Косик</div>
</section>
<div class="xpbox"><div class="xptext"><span>⭐ ОПЫТ</span><b><span id="xp">0</span> / 100</b></div><div class="xpbar"><div class="xpfill" id="xpfill" style="width:0%"></div></div></div>
<section class="panel"><h2 class="sectiontitle">СОСТОЯНИЕ КОСИКА</h2><div class="stats" id="stats"></div></section>
<section class="panel"><div class="shophead"><h2 class="sectiontitle">ГАРДЕРОБ И МЕБЕЛЬ</h2><span class="levelpill">🛍️ МАГАЗИН</span></div><div class="shopgrid" id="shopgrid"><div class="log">Загружаем каталог…</div></div><p class="log" id="shoplog"></p></section>
<section class="panel"><h2 class="sectiontitle">ПОЗАБОТЬСЯ О КОТИКЕ</h2><div class="actions">
<button class="act" data-a="feed"><span class="emoji">🐟</span>Покормить</button><button class="act" data-a="play"><span class="emoji">🧶</span>Поиграть</button><button class="act" data-a="bath"><span class="emoji">🛁</span>Искупать</button><button class="act" data-a="sleep"><span class="emoji">🛏️</span>Уложить спать</button><button class="act" data-a="pet"><span class="emoji">💗</span>Погладить</button><button class="act" data-a="quest"><span class="emoji">🎯</span>Задание</button></div>
<button class="daily" id="daily">🎁 ПОЛУЧИТЬ ЕЖЕДНЕВНУЮ НАГРАДУ · +50 🐾</button><p class="log" id="log">Загружаем домик…</p></section>
<div class="footer">KOSZAKA RPG · ТВОЙ ПУШИСТЫЙ МИР</div></main>
<script>
const tg=window.Telegram?.WebApp;tg?.ready();tg?.expand();const initData=tg?.initData||'';let shopData={items:[],inventory:[],equipped:{}};let state={hunger:80,energy:80,cleanliness:80,happiness:80,coins:120,xp:0,level:1};const labels={hunger:['🍗','Сытость'],energy:['⚡','Энергия'],cleanliness:['🫧','Чистота'],happiness:['💗','Радость']};const $=id=>document.getElementById(id);
function render(){ $('catitem').textContent=({pink_collar:'🎀',royal_crown:'👑',star_bow:'🌟'})[shopData.equipped?.accessory]||'';document.querySelector('.room').classList.toggle('has-bed',shopData.equipped?.bed==='cozy_bed');document.querySelector('.room').classList.toggle('has-plant',shopData.equipped?.plant==='flower_plant');$('coins').textContent=state.coins??0;$('level').textContent=state.level??1;$('xp').textContent=state.xp??0;$('xpfill').style.width=Math.min(100,(state.xp??0))+'%';$('stats').innerHTML=Object.entries(labels).map(([k,v])=>'<div class="stat"><div class="stathead"><span>'+v[0]+' '+v[1]+'</span><b>'+(state[k]??0)+'%</b></div><div class="meter"><div class="meterfill" style="width:'+Math.max(0,Math.min(100,state[k]??0))+'%"></div></div></div>').join('');}
async function api(path,body){const r=await fetch(path,{method:body?'POST':'GET',headers:{'Content-Type':'application/json','X-Telegram-Init-Data':initData},body:body?JSON.stringify(body):undefined});const d=await r.json();if(!r.ok)throw Error(d.error||'Ошибка');return d}
function renderShop(){const grid=$('shopgrid');if(!shopData.items.length){grid.innerHTML='<div class="log">Магазин появится после входа через Telegram.</div>';return}grid.innerHTML=shopData.items.map(item=>{const owned=shopData.inventory.includes(item.id),active=shopData.equipped?.[item.slot]===item.id;return '<div class="shopitem"><div class="itememoji">'+item.emoji+'</div><b>'+item.name+'</b><small>'+item.price+' 🐾</small><button data-shop="'+item.id+'" '+(active?'disabled':'')+'>'+(active?'Надето':owned?'Надеть':'Купить')+'</button></div>'}).join('');grid.querySelectorAll('[data-shop]').forEach(b=>b.onclick=()=>shopAction(b.dataset.shop))}
async function shopAction(itemId){const item=shopData.items.find(x=>x.id===itemId);const owned=shopData.inventory.includes(itemId);try{const d=await api(owned?'/api/equip':'/api/buy',{itemId});shopData.inventory=d.inventory||shopData.inventory;shopData.equipped=d.equipped||shopData.equipped;if(typeof d.coins==='number')state.coins=d.coins;render();renderShop();$('shoplog').textContent=owned?'Предмет надет! 💗':'Покупка успешна!';say(owned?'Красота! ✨':'Новая вещь! 🎁')}catch(e){$('shoplog').textContent=e.message}}
async function load(){if(!initData){$('log').textContent='Открой KOSZAKA через Telegram, чтобы сохранить прогресс.';render();return}try{state=await api('/api/me');shopData=await api('/api/shop');renderShop();$('petname').textContent=state.pet_name||'Косик';$('log').textContent='Твой профиль загружен 💗';render()}catch(e){$('log').textContent=e.message}}
let speechTimer;function say(message){$('speech').textContent=message;$('speech').classList.add('show');clearTimeout(speechTimer);speechTimer=setTimeout(()=>$('speech').classList.remove('show'),1800)}
async function daily(){const b=$('daily');b.disabled=true;try{state=await api('/api/daily',{});render();$('log').textContent='Награда получена: +50 монет и +15 опыта!';say('Ура! Подарок! 🎁')}catch(e){$('log').textContent=e.message}finally{b.disabled=false}}
$('daily').onclick=daily;
async function action(a){const cat=$('cat');cat.classList.remove('playing','sleeping');void cat.offsetWidth;if(a==='play')cat.classList.add('playing');if(a==='sleep')cat.classList.add('sleeping');const messages={feed:'Ням-ням! Вкусно! 🐟',play:'Лови клубочек! 🧶',bath:'Теперь я чистенький! 🫧',sleep:'Мрр… сладких снов…',pet:'Мурррр! Ещё! 💗',quest:'Задание выполнено! 🎯'};say(messages[a]);try{state=await api('/api/action',{action:a});render();$('log').textContent=messages[a]}catch(e){$('log').textContent=e.message}}
document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>action(b.dataset.a));$('cat').onclick=()=>action('pet');$('cat').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();action('pet')}};render();renderShop();load();
</script></body></html>
